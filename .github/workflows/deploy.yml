name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  migrations:
    name: Migrations drift check
    runs-on: ubuntu-latest
    services:
      db_test:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: bondi_admin
          POSTGRES_PASSWORD: WqPEfyoNesuS5xky
          POSTGRES_DB: bondi_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bondi_admin -d bondi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations (fresh DB, drift check)
        run: |
          export DATABASE_URL=postgresql+asyncpg://bondi_admin:WqPEfyoNesuS5xky@localhost:5433/bondi_test
          export REDIS_URL=redis://localhost:6380
          export SECRET_KEY=ci-secret-key
          export S3_ENDPOINT_URL=http://localhost:9090
          export S3_ACCESS_KEY=minioadmin
          export S3_SECRET_KEY=minioadmin
          export S3_REGION=us-east-1
          export S3_PUBLIC_BUCKET=photos-public-test
          export S3_PRIVATE_BUCKET=photos-private-test
          export S3_PUBLIC_BASE_URL=http://localhost:9090/photos-public-test
          export S3_SIGNED_URL_EXPIRE_SECONDS=900
          alembic upgrade head
          alembic check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      db_test:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: bondi_admin
          POSTGRES_PASSWORD: WqPEfyoNesuS5xky
          POSTGRES_DB: bondi_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bondi_admin -d bondi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis_test:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio-test \
            -p 9090:9000 \
            -e MINIO_ROOT_USER=bondi_minio \
            -e MINIO_ROOT_PASSWORD=rKpgfRsEqw9yqavC \
            minio/minio server /data --console-address ":9091"
          sleep 5
          docker run --rm \
            --network host \
            --entrypoint sh \
            minio/mc -c "
              mc alias set local http://localhost:9090 bondi_minio rKpgfRsEqw9yqavC &&
              mc mb --ignore-existing local/photos-public-test &&
              mc mb --ignore-existing local/photos-private-test &&
              mc anonymous set download local/photos-public-test
            "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker rm -f minio-test 2>/dev/null || true

  deploy:
    name: Deploy to Server
    needs: [migrations, test]
    runs-on: ubuntu-latest
    if: success()
    timeout-minutes: 60

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 45m
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,FCM_SERVICE_ACCOUNT_JSON
          script: |
            cd /opt/demo-bondi

            git config --global --add safe.directory /opt/demo-bondi || true

            set -e

            # Force-sync the repo to origin/main. The repository is the source
            # of truth for all tracked files; any local drift (manual edits,
            # leftover files like backups) is discarded so deploys never get
            # blocked. Gitignored runtime files (.env, firebase-service-account.json)
            # are untouched by reset/clean.
            git fetch origin main
            if [ -n "$(git status --porcelain)" ]; then
              echo "WARNING: server had local drift — overwriting from origin/main."
              git status --porcelain
            fi
            git reset --hard origin/main
            git clean -fd
            git checkout -B main origin/main
            git log --oneline -1

            if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then
              echo "$FCM_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
              chmod 600 firebase-service-account.json
              echo "FCM service account uploaded"
            else
              echo "WARNING: FCM_SERVICE_ACCOUNT_JSON not set, push notifications will fail"
            fi
            bash scripts/deploy.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
