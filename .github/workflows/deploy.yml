name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  migrations:
    name: Migrations drift check
    runs-on: ubuntu-latest
    services:
      db_test:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: dating_user
          POSTGRES_PASSWORD: dating_pass
          POSTGRES_DB: dating_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dating_user -d dating_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify migrations (fresh DB, drift check)
        run: |
          export DATABASE_URL=postgresql+asyncpg://dating_user:dating_pass@localhost:5433/dating_test
          export REDIS_URL=redis://localhost:6380
          export SECRET_KEY=ci-secret-key
          export S3_ENDPOINT_URL=http://localhost:9090
          export S3_ACCESS_KEY=minioadmin
          export S3_SECRET_KEY=minioadmin
          export S3_REGION=us-east-1
          export S3_PUBLIC_BUCKET=photos-public-test
          export S3_PRIVATE_BUCKET=photos-private-test
          export S3_PUBLIC_BASE_URL=http://localhost:9090/photos-public-test
          export S3_SIGNED_URL_EXPIRE_SECONDS=900
          alembic upgrade head
          alembic check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      db_test:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: dating_user
          POSTGRES_PASSWORD: dating_pass
          POSTGRES_DB: dating_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dating_user -d dating_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis_test:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio-test \
            -p 9090:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9091"
          sleep 5
          docker run --rm \
            --network host \
            --entrypoint sh \
            minio/mc -c "
              mc alias set local http://localhost:9090 minioadmin minioadmin &&
              mc mb --ignore-existing local/photos-public-test &&
              mc mb --ignore-existing local/photos-private-test &&
              mc anonymous set download local/photos-public-test
            "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/done/ -v --tb=short

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          docker rm -f minio-test 2>/dev/null || true

  deploy:
    name: Deploy to Server
    needs: [migrations, test]
    runs-on: ubuntu-latest
    if: success()
    timeout-minutes: 60

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 45m
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,FCM_SERVICE_ACCOUNT_JSON
          script: |
            cd /opt/demo-bondi

            git config --global --add safe.directory /opt/demo-bondi || true

            set -e

            # Safe sync — NEVER clobbers server state. Deploys only when the
            # server tree exactly matches origin/main (on `main`, no local
            # commits, no dirty/untracked files). Any drift aborts the pipeline
            # so nothing on the server is ever overwritten. gitignored files
            # (.env, firebase-service-account.json) never appear in the check.
            git fetch origin main
            DIRTY="$(git status --porcelain)"
            BRANCH="$(git symbolic-ref --short HEAD 2>/dev/null || echo 'detached')"
            LOCAL_ONLY="$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 1)"
            if [ -n "$DIRTY" ] || [ "$BRANCH" != "main" ] || [ "${LOCAL_ONLY:-1}" -gt 0 ]; then
              echo "ERROR: refusing to deploy — server has local drift (never overwritten by CI)."
              echo "branch: $BRANCH"
              if [ -n "$DIRTY" ]; then echo "$DIRTY"; fi
              exit 1
            fi

            # Fast-forward only — applies the new commit without touching anything
            # local. Runs BEFORE deploy.sh so the newly pushed scripts/deploy.sh
            # lands on disk and is what executes below.
            git merge --ff-only origin/main
            git log --oneline -1

            if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then
              echo "$FCM_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
              chmod 600 firebase-service-account.json
              echo "FCM service account uploaded"
            else
              echo "WARNING: FCM_SERVICE_ACCOUNT_JSON not set, push notifications will fail"
            fi
            bash scripts/deploy.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
