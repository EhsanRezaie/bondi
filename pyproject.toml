[project]
name = "bondi-backend"
version = "0.1.0"
description = "Bondi dating-app backend (FastAPI)."
requires-python = ">=3.11,<3.12"

dependencies = [
    "aioboto3==15.5.0",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "bcrypt==4.0.1",
    "botocore==1.40.61",
    "celery==5.6.3",
    "countrystatecity-countries==1.0.2",
    "cryptography==48.0.0",
    "email-validator==2.3.0",
    "fastapi==0.136.3",
    "firebase-admin==6.8.0",
    "httpx==0.28.1",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "opencv-python-headless>=4.8.0",
    "passlib==1.7.4",
    "pillow==12.2.0",
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "python-multipart==0.0.32",
    "redis==8.0.0",
    "sentry-sdk[fastapi]==2.63.0",
    "slowapi==0.1.9",
    "SQLAlchemy==2.0.50",
    "starlette==1.2.1",
    "structlog==26.1.0",
    "uvicorn==0.49.0",
    # uvicorn[standard] extras, pinned to match the previous requirements.txt
    "httptools==0.8.0",
    "uvloop==0.22.1; sys_platform != 'win32'",
    "watchfiles==1.2.0",
    "websockets==16.0",
]

[dependency-groups]
dev = [
    "coverage==7.14.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-n auto --dist loadscope"
