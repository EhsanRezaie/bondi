services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dating_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_pass@db:5432/dating_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: http://minio:9000/photos-public
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: dating_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - app

  db:
    image: postgis/postgis:15-3.3
    container_name: dating_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dating_user
      POSTGRES_PASSWORD: dating_pass
      POSTGRES_DB: dating_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating_user -d dating_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dating_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dating_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: dating_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/photos-public &&
      mc mb --ignore-existing local/photos-private &&
      mc anonymous set download local/photos-public &&
      echo 'MinIO buckets ready'
      "

  glitchtip-db-init:
    image: postgis/postgis:15-3.3
    container_name: dating_glitchtip_db_init
    entrypoint: >
      /bin/sh -c "
      psql postgresql://dating_user:dating_pass@db:5432/postgres -c
      \"CREATE DATABASE glitchtip OWNER dating_user;\" 2>/dev/null; exit 0
      "
    depends_on:
      db:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:6.2.2
    container_name: dating_glitchtip
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dating_user:dating_pass@db:5432/glitchtip
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-to-a-random-string}
      PORT: 80
    depends_on:
      glitchtip-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "showmigrations", "--plan"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  glitchtip-worker:
    image: glitchtip/glitchtip:6.2.2
    container_name: dating_glitchtip_worker
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py runworker --scheduler"
    environment:
      DATABASE_URL: postgres://dating_user:dating_pass@db:5432/glitchtip
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-to-a-random-string}
    depends_on:
      glitchtip-db-init:
        condition: service_completed_successfully
      glitchtip:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  uploads_data:
  redis_data:
  nginx_certs:
