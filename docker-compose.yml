services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dating_app
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_pass@pgbouncer:5432/dating_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      # Reached only by clients (phones/browsers), NOT the container network.
      # Override in .env with a host/IP reachable from the device, e.g.
      #   http://<server-ip>:9000/photos-public   (physical device / on a server)
      #   http://10.0.2.2:9000/photos-public      (Android emulator)
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://minio:9000/photos-public}
    volumes:
      - uploads_data:/app/uploads
      - ./firebase-service-account.json:/app/firebase-service-account.json
      - ./alembic/versions:/app/alembic/versions
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - frontend
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dating_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_pass@db:5432/dating_db
    entrypoint: ["/bin/sh", "-c", "alembic upgrade head"]
    volumes:
      - ./alembic/versions:/app/alembic/versions
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dating_celery_worker
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_ENABLED: "true"
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_pass@pgbouncer:5432/dating_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=200
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - frontend
      - internal
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dating_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_ENABLED: "true"
      DATABASE_URL: postgresql+asyncpg://dating_user:dating_pass@pgbouncer:5432/dating_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    networks:
      - frontend
      - internal

  nginx:
    image: nginx:alpine
    container_name: dating_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - app
    networks:
      - frontend
      - internal

  db:
    image: postgis/postgis:15-3.3
    container_name: dating_db
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dating_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dating_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dating_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dating_user -d dating_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: dating_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-dating_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dating_pass}
      DB_NAME: ${POSTGRES_DB:-dating_db}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_RESET_QUERY: DISCARD ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U dating_user -d dating_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dating_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dating_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: dating_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/photos-public &&
      mc mb --ignore-existing local/photos-private &&
      mc anonymous set download local/photos-public &&
      echo 'MinIO buckets ready'
      "
    networks:
      - internal

  glitchtip-db-init:
    image: postgis/postgis:15-3.3
    container_name: dating_glitchtip_db_init
    entrypoint: >
      /bin/sh -c "
      psql postgresql://dating_user:dating_pass@db:5432/postgres -c
      \"CREATE DATABASE glitchtip OWNER dating_user;\" 2>/dev/null; exit 0
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  glitchtip:
    image: glitchtip/glitchtip:6.2.2
    container_name: dating_glitchtip
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgres://dating_user:dating_pass@db:5432/glitchtip
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-to-a-random-string}
      PORT: 80
    depends_on:
      glitchtip-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "manage.py", "showmigrations", "--plan"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  glitchtip-worker:
    image: glitchtip/glitchtip:6.2.2
    container_name: dating_glitchtip_worker
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py runworker --scheduler"
    environment:
      DATABASE_URL: postgres://dating_user:dating_pass@db:5432/glitchtip
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-to-a-random-string}
    depends_on:
      glitchtip-db-init:
        condition: service_completed_successfully
      glitchtip:
        condition: service_healthy
    networks:
      - internal

networks:
  frontend:
    driver: bridge
    name: dating_frontend
  internal:
    driver: bridge
    name: dating_internal
    internal: true

volumes:
  postgres_data:
  minio_data:
  uploads_data:
  redis_data:
  nginx_certs:
