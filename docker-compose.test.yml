services:
  db_test:
    image: postgis/postgis:15-3.3
    container_name: bondi_db_test
    environment:
      POSTGRES_USER: bondi_admin
      POSTGRES_PASSWORD: WqPEfyoNesuS5xky
      POSTGRES_DB: bondi_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bondi_admin -d bondi_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:7-alpine
    container_name: bondi_redis_test
    command: redis-server --requirepass pUIv6vZrFiljc3Pp
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pUIv6vZrFiljc3Pp", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-test:
    image: minio/minio:latest
    container_name: bondi_minio_test
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: bondi_minio
      MINIO_ROOT_PASSWORD: rKpgfRsEqw9yqavC
    ports:
      - "9090:9000"   # S3 API
      - "9091:9091"   # Web console
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot init container: creates the two test buckets and sets
  # photos-public-test to allow anonymous reads. Runs once, then exits.
  # Re-running is safe (mc mb --ignore-existing, mc anonymous set are
  # both idempotent).
  minio-test-init:
    image: minio/mc:latest
    container_name: bondi_minio_test_init
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-test:9000 bondi_minio rKpgfRsEqw9yqavC &&
      mc mb --ignore-existing local/photos-public-test &&
      mc mb --ignore-existing local/photos-private-test &&
      mc anonymous set download local/photos-public-test &&
      echo 'Test MinIO buckets ready'
      "

  glitchtip-test-db-init:
    image: postgis/postgis:15-3.3
    container_name: bondi_glitchtip_test_db_init
    entrypoint: >
      /bin/sh -c "
      psql postgresql://bondi_admin:WqPEfyoNesuS5xky@db_test:5432/postgres -c
      \"CREATE DATABASE bondi_glitchtip_test OWNER bondi_admin;\" 2>/dev/null; exit 0
      "
    depends_on:
      db_test:
        condition: service_healthy

  glitchtip-test:
    image: glitchtip/glitchtip:latest
    container_name: bondi_glitchtip_test
    ports:
      - "8081:80"
    environment:
      DATABASE_URL: postgres://bondi_admin:WqPEfyoNesuS5xky@db_test:5432/bondi_glitchtip_test
      REDIS_URL: redis://:pUIv6vZrFiljc3Pp@redis_test:6379/2
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-to-a-random-string}
      PORT: 80
    depends_on:
      glitchtip-test-db-init:
        condition: service_completed_successfully
      redis_test:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_test_data:
  minio_test_data:
